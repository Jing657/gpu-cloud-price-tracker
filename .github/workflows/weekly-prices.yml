name: Collect US GPU weekly prices

on:
  schedule:
    - cron: '15 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gpu-weekly-prices
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Oracle PDF parser
        run: python -m pip install 'pdfplumber>=0.11,<1'

      - name: Collect weekly GPU prices
        id: collect
        continue-on-error: true
        env:
          GOOGLE_CLOUD_BILLING_API_KEY: ${{ secrets.GOOGLE_CLOUD_BILLING_API_KEY }}
        run: python scripts/fetch_weekly.py

      - name: Commit observed prices and status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/weekly_prices.csv data/weekly_update_status.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Collect weekly GPU price observations'
            git push
          fi

      - name: Mark failed sources
        if: steps.collect.outcome == 'failure'
        run: exit 1
